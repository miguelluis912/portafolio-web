services:
  frontend:
    image: node:22
    container_name: portafolio-lmmr
    working_dir: /app
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"
    restart: unless-stopped
